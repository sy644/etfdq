<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* iframe 全屏容器 */
        .iframe-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #ffffff;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 加载占位 */
        .loading-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #94a3b8;
            font-size: 14px;
            gap: 14px;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2;
        }
        .loading-placeholder.hidden {
            opacity: 0;
        }
        .loading-spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 悬浮球 ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #1e293b;
            color: #fff;
            font-size: 28px;
            border: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.2s;
            touch-action: manipulation;
        }
        .fab:active {
            transform: scale(0.88);
        }
        .fab.open {
            background: #0f172a;
        }

        /* ===== 弹出工具列表 ===== */
        .tool-drawer {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
            padding: 12px 0;
            min-width: 160px;
            max-width: 240px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8) translateY(10px);
            transform-origin: bottom right;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.96);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .tool-drawer.show {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }

        .tool-drawer .drawer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            border-bottom: 1px solid #f1f4f8;
            cursor: pointer;
            transition: background 0.1s;
            white-space: nowrap;
        }
        .tool-drawer .drawer-item:last-child {
            border-bottom: none;
        }
        .tool-drawer .drawer-item:active {
            background: #f1f4f8;
        }
        .tool-drawer .drawer-item .check {
            color: #3b82f6;
            font-size: 18px;
            margin-left: 12px;
            opacity: 0;
        }
        .tool-drawer .drawer-item.active .check {
            opacity: 1;
        }

        /* 管理入口（在列表底部） */
        .drawer-footer {
            border-top: 1px solid #e9edf2;
            padding: 8px 16px 4px;
            display: flex;
            justify-content: space-around;
        }
        .drawer-footer button {
            background: none;
            border: none;
            font-size: 14px;
            color: #64748b;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }
        .drawer-footer button:active {
            background: #f1f4f8;
        }
        .drawer-footer .refresh-btn-drawer {
            color: #3b82f6;
        }
        .drawer-footer .add-btn-drawer {
            color: #0f172a;
        }

        /* 无工具提示 */
        .no-tools-msg {
            padding: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        /* ===== 管理弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }
        .modal-overlay.show .modal-box {
            transform: translateY(0);
        }
        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 18px;
            color: #0f172a;
        }
        .modal-box label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            background: #fafcfd;
        }
        .modal-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .modal-actions .btn-cancel {
            background: #f1f4f8;
            color: #1e293b;
        }
        .modal-actions .btn-cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-confirm {
            background: #1e293b;
            color: #fff;
        }
        .modal-actions .btn-confirm:hover {
            background: #0f172a;
        }
        .tool-list {
            margin: 12px 0 8px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #e9edf2;
            padding-top: 10px;
        }
        .tool-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #f1f4f8;
            font-size: 14px;
        }
        .tool-list-item .name {
            font-weight: 500;
            color: #0f172a;
        }
        .tool-list-item .url {
            color: #64748b;
            font-size: 12px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tool-list-item .del-tool {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
        }
        .tool-list-item .del-tool:hover {
            color: #ef4444;
        }
        .no-tools {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 16px 0;
        }

        /* ===== 暗色适配 ===== */
        @media (prefers-color-scheme: dark) {
            .fab {
                background: #334155;
            }
            .tool-drawer {
                background: rgba(30, 41, 59, 0.96);
                border-color: rgba(255,255,255,0.08);
            }
            .tool-drawer .drawer-item {
                color: #e2e8f0;
                border-bottom-color: rgba(255,255,255,0.06);
            }
            .tool-drawer .drawer-item:active {
                background: rgba(255,255,255,0.06);
            }
            .drawer-footer {
                border-top-color: rgba(255,255,255,0.08);
            }
            .drawer-footer button {
                color: #94a3b8;
            }
            .drawer-footer .refresh-btn-drawer {
                color: #60a5fa;
            }
            .drawer-footer .add-btn-drawer {
                color: #e2e8f0;
            }
            .modal-box {
                background: #1e293b;
                color: #e2e8f0;
            }
            .modal-box label {
                color: #cbd5e1;
            }
            .modal-box input {
                background: #0f172a;
                border-color: #334155;
                color: #e2e8f0;
            }
            .modal-actions .btn-cancel {
                background: #334155;
                color: #e2e8f0;
            }
            .modal-actions .btn-confirm {
                background: #3b82f6;
            }
        }

        /* 空状态时显示友好提示 */
        .empty-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #94a3b8;
            z-index: 1;
            padding: 40px;
            text-align: center;
        }
        .empty-overlay .big-icon {
            font-size: 72px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-overlay h2 {
            font-size: 20px;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .empty-overlay p {
            font-size: 15px;
            max-width: 280px;
            line-height: 1.6;
        }
        .empty-overlay .hint-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: #1e293b;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .empty-overlay .hint-btn:active {
            background: #0f172a;
        }
        @media (prefers-color-scheme: dark) {
            .empty-overlay {
                background: #0f172a;
            }
            .empty-overlay h2 {
                color: #f1f5f9;
            }
            .empty-overlay p {
                color: #64748b;
            }
            .empty-overlay .hint-btn {
                background: #3b82f6;
            }
        }
    </style>
</head>
<body>

    <!-- ===== iframe 容器（全屏） ===== -->
    <div class="iframe-wrapper" id="iframeWrapper">
        <!-- 加载占位 -->
        <div class="loading-placeholder hidden" id="loadingPlaceholder">
            <div class="loading-spinner"></div>
            <span>加载中…</span>
        </div>
        <!-- 空状态 -->
        <div class="empty-overlay" id="emptyOverlay">
            <div class="big-icon">🧰</div>
            <h2>还没有工具</h2>
            <p>点击右下角的悬浮球，选择「添加」来添加你的第一个工具吧</p>
            <button class="hint-btn" id="emptyAddBtn">＋ 添加工具</button>
        </div>
    </div>

    <!-- ===== 悬浮球 ===== -->
    <button class="fab" id="fabBtn" aria-label="切换工具">🧰</button>

    <!-- ===== 弹出工具列表 ===== -->
    <div class="tool-drawer" id="toolDrawer">
        <div id="drawerList"></div>
        <div class="drawer-footer">
            <button class="refresh-btn-drawer" id="refreshDrawerBtn">⟳ 刷新</button>
            <button class="add-btn-drawer" id="addDrawerBtn">＋ 添加</button>
        </div>
    </div>

    <!-- ===== 管理弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle">管理工具</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">关闭</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 存储 ———— 无预设工具，完全由用户添加
            // ============================================================
            const STORAGE_KEY = 'toolbox_tools';

            function loadTools() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed) && parsed.length >= 0) {
                            return parsed;
                        }
                    }
                } catch (e) {}
                // 无数据时返回空数组
                return [];
            }

            function saveTools(tools) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
            }

            // ============================================================
            // 2. DOM 引用
            // ============================================================
            const wrapper = document.getElementById('iframeWrapper');
            const loadingEl = document.getElementById('loadingPlaceholder');
            const emptyOverlay = document.getElementById('emptyOverlay');
            const emptyAddBtn = document.getElementById('emptyAddBtn');
            const fabBtn = document.getElementById('fabBtn');
            const drawer = document.getElementById('toolDrawer');
            const drawerList = document.getElementById('drawerList');
            const refreshDrawerBtn = document.getElementById('refreshDrawerBtn');
            const addDrawerBtn = document.getElementById('addDrawerBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            const modalCancel = document.getElementById('modalCancel');

            let currentIframe = null;
            let activeIndex = 0;
            let tools = loadTools();
            let isDrawerOpen = false;

            // ============================================================
            // 3. 更新空状态显示
            // ============================================================
            function updateEmptyState() {
                if (tools.length === 0) {
                    emptyOverlay.style.display = 'flex';
                    if (currentIframe) {
                        currentIframe.remove();
                        currentIframe = null;
                    }
                    loadingEl.classList.add('hidden');
                } else {
                    emptyOverlay.style.display = 'none';
                }
            }

            // ============================================================
            // 4. 渲染弹出列表
            // ============================================================
            function renderDrawer() {
                drawerList.innerHTML = '';
                if (tools.length === 0) {
                    drawerList.innerHTML = `<div class="no-tools-msg">暂无工具，点击「添加」</div>`;
                    return;
                }
                tools.forEach((tool, index) => {
                    const item = document.createElement('div');
                    item.className = 'drawer-item' + (index === activeIndex ? ' active' : '');
                    item.innerHTML = `
                        <span>${escapeHtml(tool.name)}</span>
                        <span class="check">✓</span>
                    `;
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        switchTool(index);
                        closeDrawer();
                    });
                    drawerList.appendChild(item);
                });
            }

            // ============================================================
            // 5. 切换工具
            // ============================================================
            function switchTool(index) {
                if (tools.length === 0) {
                    updateEmptyState();
                    return;
                }
                if (index < 0 || index >= tools.length) {
                    index = 0;
                }
                activeIndex = index;
                const tool = tools[index];
                if (!tool) return;

                // 隐藏空状态
                emptyOverlay.style.display = 'none';

                // 更新列表高亮
                document.querySelectorAll('.drawer-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                loadingEl.classList.remove('hidden');

                if (currentIframe) {
                    currentIframe.remove();
                    currentIframe = null;
                }

                const iframe = document.createElement('iframe');
                iframe.src = tool.src;
                iframe.allow = 'accelerometer; camera; gyroscope; microphone; autoplay; clipboard-read; clipboard-write';
                iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-popups allow-modals';
                iframe.loading = 'eager';
                wrapper.appendChild(iframe);
                currentIframe = iframe;

                iframe.addEventListener('load', function onLoad() {
                    loadingEl.classList.add('hidden');
                    iframe.removeEventListener('load', onLoad);
                });

                setTimeout(() => {
                    if (!loadingEl.classList.contains('hidden')) {
                        loadingEl.classList.add('hidden');
                    }
                }, 5000);
            }

            // ============================================================
            // 6. 刷新
            // ============================================================
            function refreshCurrent() {
                if (currentIframe) {
                    loadingEl.classList.remove('hidden');
                    const src = currentIframe.src;
                    currentIframe.src = 'about:blank';
                    setTimeout(() => {
                        currentIframe.src = src;
                    }, 80);
                    const onRefreshLoad = function() {
                        loadingEl.classList.add('hidden');
                        currentIframe.removeEventListener('load', onRefreshLoad);
                    };
                    currentIframe.addEventListener('load', onRefreshLoad);
                    setTimeout(() => {
                        if (!loadingEl.classList.contains('hidden')) {
                            loadingEl.classList.add('hidden');
                        }
                    }, 5000);
                } else if (tools.length > 0) {
                    switchTool(activeIndex);
                }
            }

            // ============================================================
            // 7. 抽屉开关
            // ============================================================
            function toggleDrawer() {
                if (tools.length === 0) {
                    // 没有工具时，点击悬浮球直接打开管理弹窗
                    openManageModal();
                    return;
                }
                isDrawerOpen = !isDrawerOpen;
                drawer.classList.toggle('show', isDrawerOpen);
                fabBtn.classList.toggle('open', isDrawerOpen);
                fabBtn.textContent = isDrawerOpen ? '✕' : '🧰';
                if (isDrawerOpen) renderDrawer();
            }

            function closeDrawer() {
                isDrawerOpen = false;
                drawer.classList.remove('show');
                fabBtn.classList.remove('open');
                fabBtn.textContent = '🧰';
            }

            // ============================================================
            // 8. 管理弹窗
            // ============================================================
            function openManageModal() {
                renderManageContent();
                modalOverlay.classList.add('show');
                closeDrawer();
            }

            function closeManageModal() {
                modalOverlay.classList.remove('show');
            }

            function renderManageContent() {
                let html = `
                    <label>工具名称</label>
                    <input type="text" id="newToolName" placeholder="例如：记账本" />
                    <label>网址 (URL)</label>
                    <input type="url" id="newToolUrl" placeholder="https://example.com/" />
                    <div style="margin-top:12px; text-align:right;">
                        <button class="btn-confirm" id="addToolBtn" style="padding:8px 24px;">添加</button>
                    </div>
                    <div class="tool-list" id="toolListContainer">
                `;
                if (tools.length === 0) {
                    html += `<div class="no-tools">还没有工具，快来添加吧</div>`;
                } else {
                    tools.forEach((t, i) => {
                        html += `
                            <div class="tool-list-item">
                                <div>
                                    <div class="name">${escapeHtml(t.name)}</div>
                                    <div class="url">${escapeHtml(t.src)}</div>
                                </div>
                                <button class="del-tool" data-index="${i}" title="删除">✕</button>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                modalBody.innerHTML = html;

                // 添加事件
                const addBtnEl = document.getElementById('addToolBtn');
                const nameInput = document.getElementById('newToolName');
                const urlInput = document.getElementById('newToolUrl');
                addBtnEl.addEventListener('click', function() {
                    const name = nameInput.value.trim();
                    let url = urlInput.value.trim();
                    if (!name || !url) {
                        alert('请填写完整信息');
                        return;
                    }
                    try {
                        new URL(url);
                    } catch (e) {
                        alert('网址格式不正确，请以 http:// 或 https:// 开头');
                        return;
                    }
                    tools.push({ name, src: url });
                    saveTools(tools);
                    renderManageContent();
                    renderDrawer();
                    updateEmptyState();
                    // 自动切换到新工具
                    switchTool(tools.length - 1);
                    nameInput.value = '';
                    urlInput.value = '';
                });

                document.querySelectorAll('.del-tool').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index, 10);
                        if (isNaN(index)) return;
                        if (confirm(`确定要删除「${tools[index].name}」吗？`)) {
                            tools.splice(index, 1);
                            saveTools(tools);
                            if (activeIndex >= tools.length) {
                                activeIndex = Math.max(0, tools.length - 1);
                            }
                            renderManageContent();
                            renderDrawer();
                            updateEmptyState();
                            if (tools.length > 0) {
                                switchTool(activeIndex);
                            } else {
                                if (currentIframe) {
                                    currentIframe.remove();
                                    currentIframe = null;
                                }
                                loadingEl.classList.add('hidden');
                            }
                        }
                    });
                });

                // 回车提交
                [nameInput, urlInput].forEach(inp => {
                    if (inp) {
                        inp.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                addBtnEl.click();
                            }
                        });
                    }
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            // 9. 初始化 & 事件绑定
            // ============================================================
            function init() {
                updateEmptyState();
                if (tools.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    const toolParam = parseInt(params.get('tool'), 10);
                    const startIndex = (isNaN(toolParam) || toolParam < 0 || toolParam >= tools.length) ?
                        0 : toolParam;
                    activeIndex = startIndex;
                    switchTool(startIndex);
                } else {
                    loadingEl.classList.add('hidden');
                }
                renderDrawer();

                // 悬浮球点击
                fabBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleDrawer();
                });

                // 空状态里的添加按钮
                emptyAddBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openManageModal();
                });

                // 点击空白关闭抽屉
                document.addEventListener('click', function(e) {
                    if (isDrawerOpen && !drawer.contains(e.target) && e.target !== fabBtn) {
                        closeDrawer();
                    }
                });

                // 抽屉内的刷新和添加
                refreshDrawerBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    refreshCurrent();
                    closeDrawer();
                });
                addDrawerBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openManageModal();
                });

                // 管理弹窗取消
                modalCancel.addEventListener('click', closeManageModal);
                modalOverlay.addEventListener('click', function(e) {
                    if (e.target === modalOverlay) closeManageModal();
                });

                // 键盘快捷键 Ctrl+R (在 iframe 内)
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
                            e.preventDefault();
                            refreshCurrent();
                            closeDrawer();
                        }
                    }
                });

                // 监听 storage 变化（跨标签页同步）
                window.addEventListener('storage', function(e) {
                    if (e.key === STORAGE_KEY) {
                        tools = loadTools();
                        renderDrawer();
                        updateEmptyState();
                        if (activeIndex >= tools.length) {
                            activeIndex = Math.max(0, tools.length - 1);
                        }
                        if (tools.length > 0) {
                            switchTool(activeIndex);
                        } else {
                            if (currentIframe) {
                                currentIframe.remove();
                                currentIframe = null;
                            }
                            loadingEl.classList.add('hidden');
                        }
                    }
                });

                console.log('🧰 工具箱启动 — 悬浮球模式（无预设工具）');
                console.log('📦 当前工具数:', tools.length);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

            // 暴露调试接口
            window.__toolbox = {
                tools: () => tools,
                switchTool,
                refreshCurrent,
                addTool: (name, src) => {
                    tools.push({ name, src });
                    saveTools(tools);
                    renderDrawer();
                    updateEmptyState();
                    switchTool(tools.length - 1);
                },
                removeTool: (index) => {
                    tools.splice(index, 1);
                    saveTools(tools);
                    renderDrawer();
                    updateEmptyState();
                    if (activeIndex >= tools.length) activeIndex = tools.length - 1;
                    if (tools.length > 0) switchTool(activeIndex);
                    else { if (currentIframe) { currentIframe.remove(); currentIframe = null; } loadingEl.classList.add('hidden'); }
                }
            };

        })();
    </script>

</body>
</html>
