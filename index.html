<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>我的工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            padding: 20px 16px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部标题和操作栏 */
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #0f172a;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .header-actions button {
            background: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions button:active {
            transform: scale(0.94);
            background: #e9edf2;
        }
        .header-actions .add-btn {
            background: #1e293b;
            color: #fff;
        }
        .header-actions .add-btn:active {
            background: #0f172a;
        }

        /* 图标网格容器 */
        .grid {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 16px;
            transition: all 0.2s;
        }

        /* 每个工具卡片 */
        .tool-card {
            flex: 0 0 auto;
            /* 宽度由 js 动态计算，保证自适应 */;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            text-decoration: none;
            color: #0f172a;
            position: relative;
            border: 1px solid rgba(0,0,0,0.02);
            padding: 8px;
        }
        .tool-card:active {
            transform: scale(0.94);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .tool-card .icon {
            font-size: 40px;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 6px;
            color: #fff;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b82f6;
            text-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .tool-card .label {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
            color: #1e293b;
        }

        /* 删除按钮（悬停/点击显示） */
        .tool-card .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: 2px solid #fff;
            font-size: 16px;
            font-weight: 300;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(239,68,68,0.3);
            line-height: 1;
        }
        .tool-card:hover .delete-btn,
        .tool-card:focus-within .delete-btn {
            display: flex;
        }
        /* 手机触摸长按显示删除（简化处理：点击卡片会跳转，所以删除用独立按钮） */
        .tool-card .delete-btn:active {
            transform: scale(0.85);
        }

        /* 空状态 */
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state .big-icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state p {
            font-size: 16px;
        }

        /* ===== 管理弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }
        .modal-overlay.show .modal-box {
            transform: translateY(0);
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #0f172a;
        }
        .modal-box label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-top: 14px;
            margin-bottom: 4px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
            background: #fafcfd;
        }
        .modal-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .modal-actions .btn-cancel {
            background: #f1f4f8;
            color: #1e293b;
        }
        .modal-actions .btn-cancel:active {
            background: #e2e8f0;
        }
        .modal-actions .btn-confirm {
            background: #1e293b;
            color: #fff;
        }
        .modal-actions .btn-confirm:active {
            background: #0f172a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body { padding: 16px 12px 80px; }
            .header h1 { font-size: 20px; }
            .header-actions button { padding: 6px 14px; font-size: 13px; }
            .tool-card .icon { width: 52px; height: 52px; font-size: 32px; }
            .tool-card .label { font-size: 12px; }
        }

        /* 暗色模式适配 */
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; }
            .header h1 { color: #f1f5f9; }
            .header-actions button { background: #1e293b; color: #e2e8f0; box-shadow: none; }
            .header-actions .add-btn { background: #3b82f6; color: #fff; }
            .tool-card { background: #1e293b; border-color: #334155; color: #f1f5f9; }
            .tool-card .label { color: #e2e8f0; }
            .empty-state { color: #64748b; }
            .modal-box { background: #1e293b; color: #f1f5f9; }
            .modal-box label { color: #cbd5e1; }
            .modal-box input { background: #0f172a; border-color: #334155; color: #e2e8f0; }
            .modal-actions .btn-cancel { background: #334155; color: #e2e8f0; }
            .modal-actions .btn-confirm { background: #3b82f6; }
        }
    </style>
</head>
<body>

    <!-- 顶部 -->
    <div class="header">
        <h1>📱 我的工具</h1>
        <div class="header-actions">
            <button class="add-btn" id="addBtn">＋ 添加</button>
        </div>
    </div>

    <!-- 图标网格 -->
    <div class="grid" id="gridContainer"></div>

    <!-- ===== 添加/编辑弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle">添加工具</h3>
            <label>工具名称</label>
            <input type="text" id="toolNameInput" placeholder="例如：记账本" />
            <label>网址 (URL)</label>
            <input type="url" id="toolUrlInput" placeholder="https://example.com/" />
            <label>图标 (可选, 一个 emoji 或字母)</label>
            <input type="text" id="toolIconInput" placeholder="📊 或 A" maxlength="2" />
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">保存</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 存储
            // ============================================================
            const STORAGE_KEY = 'toolbox_icons_tools';

            // 预设为空数组（用户自行添加）
            const DEFAULT_TOOLS = [];

            function loadTools() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed) && parsed.length >= 0) {
                            return parsed;
                        }
                    }
                } catch (e) {}
                // 如果无数据，写入默认（空）并返回
                saveTools(DEFAULT_TOOLS);
                return DEFAULT_TOOLS.slice();
            }

            function saveTools(tools) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
            }

            // ============================================================
            // 2. DOM 引用
            // ============================================================
            const grid = document.getElementById('gridContainer');
            const addBtn = document.getElementById('addBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const toolNameInput = document.getElementById('toolNameInput');
            const toolUrlInput = document.getElementById('toolUrlInput');
            const toolIconInput = document.getElementById('toolIconInput');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            let tools = loadTools();
            let editingIndex = -1; // -1 表示新增

            // ============================================================
            // 3. 颜色生成 (基于字符串)
            // ============================================================
            function stringToColor(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 360;
                return `hsl(${hue}, 65%, 55%)`;
            }

            // ============================================================
            // 4. 渲染网格 (自适应大小)
            // ============================================================
            function renderGrid() {
                grid.innerHTML = '';

                if (tools.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="big-icon">🧰</div>
                            <p>还没有工具，点击右上角「添加」</p>
                        </div>
                    `;
                    return;
                }

                // 计算每个卡片尺寸：容器宽度 - 间距 (gap 16px)
                const containerWidth = grid.clientWidth || 800;
                // 根据工具数量动态决定每行个数：最少2个，最多6个，并保证最小尺寸120px
                let columns = Math.min(6, Math.max(2, Math.ceil(Math.sqrt(tools.length * 1.5))));
                // 如果工具很少（≤3），让卡片大一些
                if (tools.length <= 3) columns = 2;
                else if (tools.length <= 6) columns = 3;
                else if (tools.length <= 12) columns = 4;
                else columns = 5;

                // 计算卡片宽度： (总宽度 - (columns-1)*gap) / columns
                const gap = 16;
                const availableWidth = containerWidth - (columns - 1) * gap;
                const cardSize = Math.max(100, Math.floor(availableWidth / columns));
                // 限制最大尺寸 180px
                const finalSize = Math.min(cardSize, 180);

                tools.forEach((tool, index) => {
                    const card = document.createElement('a');
                    card.className = 'tool-card';
                    card.href = tool.src;
                    card.target = '_blank'; // 新窗口打开，用户也可通过设置改为 _self
                    card.rel = 'noopener noreferrer';
                    card.style.width = finalSize + 'px';
                    card.style.height = finalSize + 'px';

                    // 图标
                    let iconChar = tool.icon ? tool.icon.trim() : '';
                    if (!iconChar) {
                        // 取名称首字母，若为中文则取第一个汉字
                        const first = tool.name.trim().charAt(0) || '?';
                        iconChar = first.toUpperCase();
                    }
                    const bgColor = stringToColor(tool.name + tool.src);

                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'icon';
                    iconDiv.style.background = bgColor;
                    iconDiv.textContent = iconChar;

                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = tool.name;

                    // 删除按钮
                    const delBtn = document.createElement('div');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.title = '删除此工具';
                    // 阻止点击删除时触发跳转
                    delBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (confirm(`确定删除「${tool.name}」吗？`)) {
                            tools.splice(index, 1);
                            saveTools(tools);
                            renderGrid();
                        }
                    });

                    card.appendChild(iconDiv);
                    card.appendChild(label);
                    card.appendChild(delBtn);

                    // 点击卡片跳转（默认在新窗口打开）
                    // 如果需要当前窗口，可修改 target，或使用 onclick 阻止默认
                    card.addEventListener('click', function(e) {
                        // 如果点击了删除按钮，不会到这里
                        // 默认行为是打开链接
                    });

                    grid.appendChild(card);
                });
            }

            // ============================================================
            // 5. 管理弹窗（添加/编辑）
            // ============================================================
            function openModal(index = -1) {
                editingIndex = index;
                if (index === -1) {
                    modalTitle.textContent = '添加工具';
                    toolNameInput.value = '';
                    toolUrlInput.value = '';
                    toolIconInput.value = '';
                } else {
                    const tool = tools[index];
                    modalTitle.textContent = '编辑工具';
                    toolNameInput.value = tool.name;
                    toolUrlInput.value = tool.src;
                    toolIconInput.value = tool.icon || '';
                }
                modalOverlay.classList.add('show');
                // 聚焦第一个输入
                setTimeout(() => toolNameInput.focus(), 100);
            }

            function closeModal() {
                modalOverlay.classList.remove('show');
                editingIndex = -1;
            }

            function saveToolFromModal() {
                const name = toolNameInput.value.trim();
                let src = toolUrlInput.value.trim();
                const icon = toolIconInput.value.trim().slice(0, 2);

                if (!name || !src) {
                    alert('请填写名称和网址');
                    return;
                }
                // 验证 URL
                try {
                    new URL(src);
                } catch (e) {
                    alert('网址格式不正确，请以 http:// 或 https:// 开头');
                    return;
                }

                const newTool = { name, src, icon: icon || undefined };

                if (editingIndex === -1) {
                    // 新增
                    tools.push(newTool);
                } else {
                    // 编辑
                    tools[editingIndex] = newTool;
                }

                saveTools(tools);
                renderGrid();
                closeModal();
            }

            // ============================================================
            // 6. 事件绑定
            // ============================================================
            addBtn.addEventListener('click', function() {
                openModal(-1);
            });

            modalCancel.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            modalConfirm.addEventListener('click', saveToolFromModal);

            // 键盘回车提交
            toolNameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') toolUrlInput.focus(); });
            toolUrlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') toolIconInput.focus(); });
            toolIconInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') modalConfirm.click(); });

            // 监听窗口 resize 重新渲染（调整卡片大小）
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => renderGrid(), 200);
            });

            // 监听 storage 变化（多标签页同步）
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) {
                    tools = loadTools();
                    renderGrid();
                }
            });

            // ============================================================
            // 7. 初始化
            // ============================================================
            function init() {
                renderGrid();
                console.log('🏠 主页图标工具箱已启动（无预设工具）');
                console.log('📦 当前工具数:', tools.length);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

            // 调试接口
            window.__toolbox = {
                tools: () => tools,
                addTool: (name, src, icon) => {
                    tools.push({ name, src, icon });
                    saveTools(tools);
                    renderGrid();
                },
                removeTool: (index) => {
                    tools.splice(index, 1);
                    saveTools(tools);
                    renderGrid();
                },
                clearAll: () => {
                    if (confirm('删除所有工具？')) {
                        tools = [];
                        saveTools(tools);
                        renderGrid();
                    }
                }
            };

        })();
    </script>

</body>
</html>
